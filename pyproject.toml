[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomzy-desktop-companion"
dynamic = ["version"]
description = "A small animated desktop companion built with PySide6."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "PySide6>=6.5,<7",
    "pyobjc-framework-Cocoa>=10,<13; sys_platform == 'darwin'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.gui-scripts]
nomzy = "nomzy.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "nomzy.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/nomzy/assets" = ["assets/nomzy_animations.json"]
"share/nomzy/assets/animations" = ["assets/animations/*.png"]
"share/nomzy/config" = ["config/*.json"]
